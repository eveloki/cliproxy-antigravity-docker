name: Stable container release
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a fixed stable version, GitHub Release, stable and latest
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      checkout_ref:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Shell, Python and source-snapshot checks
        run: |
          for script in scripts/*.sh tests/*.sh; do bash -n "$script"; done
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v
          python3 scripts/update-upstreams.py
          docker compose config --quiet
  image:
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-experimental-publisher
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image name, exact source and publication mode
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          REQUEST_PUBLISH: ${{ inputs.publish }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$REQUEST_PUBLISH" == true ]]; then publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          python3 scripts/update-upstreams.py
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.image.outputs.image_tag }}
            type=raw,value=sha-${{ steps.image.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.cliproxy.distribution.status=STABLE
            io.cliproxy.distribution.channel=stable
            io.cliproxy.upstream.versions=${{ steps.image.outputs.version_suffix }}
      - name: Build candidate (including upstream unit and ABI tests)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cliproxy-candidate:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cliproxy-amd64
          cache-to: type=gha,mode=max,scope=cliproxy-amd64
      - name: Offline container integration smoke
        run: bash tests/image-smoke.sh cliproxy-candidate:test
      - name: Refuse to publish a superseded main revision
        if: steps.image.outputs.publish == 'true'
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          [[ "$current" == "$(git rev-parse HEAD)" ]] || { echo 'Main changed; publish its latest revision instead.'; exit 1; }
      - uses: docker/login-action@v3
        if: steps.image.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve an existing fixed release
        id: version
        if: steps.image.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.image_tag }}
        run: |
          digest=$(python3 scripts/image-digest.py "$IMAGE:$VERSION")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if [[ -n "$digest" ]]; then
            echo "Preserving $IMAGE:$VERSION at $digest. Bump packaging_revision to publish different content."
          fi
      - name: Publish tested build with attestations
        id: publish
        if: steps.image.outputs.publish == 'true' && steps.version.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cliproxy-amd64
          cache-to: type=gha,mode=max,scope=cliproxy-amd64
          provenance: true
          sbom: true
      - name: Publish GitHub stable release
        if: steps.image.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.image_tag }}
          DIGEST: ${{ steps.publish.outputs.digest || steps.version.outputs.digest }}
          SOURCE_SHA: ${{ steps.image.outputs.sha }}
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          [[ "$current" == "$SOURCE_SHA" ]] || { echo 'Main changed; refusing to create a release.'; exit 1; }
          [[ -n "$DIGEST" && "$(python3 scripts/image-digest.py "$IMAGE:$VERSION")" == "$DIGEST" ]]
          notes=$(mktemp)
          {
            echo "Stable release: $VERSION"
            echo
            echo "Image: $IMAGE:$VERSION"
            echo "Digest: $IMAGE@$DIGEST"
            echo
            echo 'Default model: gemini-3.8-flash (API: agy/gemini-3.8-flash).'
            echo 'The owner confirmed live model availability on 2026-10-01.'
            echo 'This build passed the CLI startup and offline JSON/SSE integration checks.'
            echo 'CI does not use Google credentials. See docs/TESTING.md for validation scope.'
            echo
            echo "Source and instructions: https://github.com/$GH_REPO/tree/$SOURCE_SHA"
          } > "$notes"
          if ! gh release view "$VERSION" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$VERSION" --repo "$GH_REPO" --target "$SOURCE_SHA" \
              --title "$VERSION" --notes-file "$notes" --latest
          fi
          rm -f "$notes"
      - name: Promote stable and latest and verify all three digests
        if: steps.image.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.image_tag }}
          DIGEST: ${{ steps.publish.outputs.digest || steps.version.outputs.digest }}
          SOURCE_SHA: ${{ steps.image.outputs.sha }}
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          [[ "$current" == "$SOURCE_SHA" ]] || { echo 'Main changed; refusing to move stable aliases.'; exit 1; }
          [[ -n "$DIGEST" && "$(python3 scripts/image-digest.py "$IMAGE:$VERSION")" == "$DIGEST" ]]
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:stable" "$IMAGE@$DIGEST"
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          [[ "$(python3 scripts/image-digest.py "$IMAGE:$VERSION")" == "$DIGEST" ]]
          [[ "$(python3 scripts/image-digest.py "$IMAGE:stable")" == "$DIGEST" ]]
          [[ "$(python3 scripts/image-digest.py "$IMAGE:latest")" == "$DIGEST" ]]
          {
            echo '### Stable release published'
            echo "- Fixed release: \`$IMAGE:$VERSION\`"
            echo "- Moving aliases: \`$IMAGE:stable\`, \`$IMAGE:latest\`"
            echo "- Digest (all three tags): \`$IMAGE@$DIGEST\`"
            echo "- Workflow checkout: \`$SOURCE_SHA\` (an existing version retains its original source label)"
            echo '- Model: gemini-3.8-flash. Owner-reported live validation and remaining test scope: docs/TESTING.md.'
          } >> "$GITHUB_STEP_SUMMARY"
