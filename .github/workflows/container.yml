name: Experimental container (NOT READY)
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*-alpha*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an experimental GHCR image (still NOT READY)
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      checkout_ref:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Shell, Python and version-lock checks
        run: |
          for script in scripts/*.sh tests/*.sh; do bash -n "$script"; done
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v
          python3 scripts/update-upstreams.py
          docker compose config --quiet
  image:
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-experimental-publisher
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image name, exact source and publication mode
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REQUEST_PUBLISH: ${{ inputs.publish }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$EVENT" == push && "$REF" == refs/tags/v*-alpha* ]]; then publish=true; fi
          if [[ "$REQUEST_PUBLISH" == true ]]; then publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          python3 scripts/update-upstreams.py
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=experimental
            type=raw,value=experimental-sha-${{ steps.image.outputs.sha }}
            type=raw,value=experimental-${{ steps.image.outputs.version_suffix }}-${{ steps.image.outputs.short_sha }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.cliproxy.distribution.status=NOT_READY_PENDING_TESTS
            io.cliproxy.upstream.versions=${{ steps.image.outputs.version_suffix }}
      - name: Build candidate (including upstream unit and ABI tests)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cliproxy-candidate:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cliproxy-amd64
          cache-to: type=gha,mode=max,scope=cliproxy-amd64
      - name: Offline container integration smoke
        run: bash tests/image-smoke.sh cliproxy-candidate:test
      - name: Refuse to publish a superseded main revision
        if: steps.image.outputs.publish == 'true'
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          [[ "$current" == "$(git rev-parse HEAD)" ]] || { echo 'Main changed; publish its latest revision instead.'; exit 1; }
      - uses: docker/login-action@v3
        if: steps.image.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested build with attestations
        id: publish
        if: steps.image.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cliproxy-amd64
          cache-to: type=gha,mode=max,scope=cliproxy-amd64
          provenance: true
          sbom: true
      - name: Verify published manifest and record digest
        if: steps.image.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          SOURCE_SHA: ${{ steps.image.outputs.sha }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          {
            echo '### Experimental image published — NOT READY'
            echo "- Image: \`$IMAGE:experimental\`"
            echo "- Digest: \`$IMAGE@$DIGEST\`"
            echo "- Source: \`$SOURCE_SHA\`"
            echo '- Real Google OAuth and tool-call acceptance tests remain pending.'
          } >> "$GITHUB_STEP_SUMMARY"
